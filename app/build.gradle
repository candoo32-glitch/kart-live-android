plugins { id 'com.android.application' }
android {
    namespace 'com.kartgarden.live'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kartgarden.live'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all { systemProperty 'kart.fixtureDir', file('build/swift-fixtures').absolutePath }
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
